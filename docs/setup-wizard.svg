<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1601" viewBox="0 0 920 1601" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">
<rect width="920" height="1601" rx="10" fill="#0d1117"/>
<rect width="920" height="44" rx="10" fill="#161b22"/><rect y="34" width="920" height="10" fill="#161b22"/>
<circle cx="22" cy="22" r="6" fill="#ff5f57"/>
<circle cx="42" cy="22" r="6" fill="#febc2e"/>
<circle cx="62" cy="22" r="6" fill="#28c840"/>
<text x="460.0" y="26" fill="#6e7681" text-anchor="middle" font-size="12">npm run init</text>
<text x="26.0" y="87.5" fill="#f0f6fc" font-weight="bold" xml:space="preserve">Claude Code Telegram Bridge — setup</text>
<text x="26.0" y="105.0" fill="#6e7681" xml:space="preserve">Nothing is written until you confirm at the end.</text>
<text x="26.0" y="140.0" fill="#f0f6fc" font-weight="bold" xml:space="preserve">[1/6] Checking prerequisites</text>
<text x="26.0" y="157.5" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="157.5" fill="#3fb950" font-weight="bold" xml:space="preserve">✓</text>
<text x="51.3" y="157.5" fill="#c9d1d9" xml:space="preserve"> Node 24.2.0</text>
<text x="26.0" y="175.0" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="175.0" fill="#3fb950" font-weight="bold" xml:space="preserve">✓</text>
<text x="51.3" y="175.0" fill="#c9d1d9" xml:space="preserve"> Claude Code: 2.1.238 (Claude Code)</text>
<text x="26.0" y="192.5" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="192.5" fill="#d29922" font-weight="bold" xml:space="preserve">!</text>
<text x="51.3" y="192.5" fill="#c9d1d9" xml:space="preserve"> No Claude login found. Run claude once and sign in, or set ANTHROPIC_API_KEY.</text>
<text x="26.0" y="210.0" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="210.0" fill="#3fb950" font-weight="bold" xml:space="preserve">✓</text>
<text x="51.3" y="210.0" fill="#c9d1d9" xml:space="preserve"> ffmpeg found</text>
<text x="26.0" y="227.5" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="227.5" fill="#d29922" font-weight="bold" xml:space="preserve">!</text>
<text x="51.3" y="227.5" fill="#c9d1d9" xml:space="preserve"> whisper not found — voice notes will be handed to Claude as files rather than transcripts.</text>
<text x="26.0" y="262.5" fill="#f0f6fc" font-weight="bold" xml:space="preserve">[2/6] Telegram bot</text>
<text x="26.0" y="280.0" fill="#c9d1d9" xml:space="preserve">  In Telegram, message @BotFather and send /newbot.</text>
<text x="26.0" y="297.5" fill="#c9d1d9" xml:space="preserve">  It replies with a token like 123456789:AAE….</text>
<text x="26.0" y="332.5" fill="#58a6ff" xml:space="preserve">  Bot token: 8123456789:AAHexample-token-not-a-real-one</text>
<text x="26.0" y="350.0" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="350.0" fill="#3fb950" font-weight="bold" xml:space="preserve">✓</text>
<text x="51.3" y="350.0" fill="#c9d1d9" xml:space="preserve"> Connected as @your_bot (Your Assistant)</text>
<text x="26.0" y="367.5" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="367.5" fill="#d29922" font-weight="bold" xml:space="preserve">!</text>
<text x="51.3" y="367.5" fill="#c9d1d9" xml:space="preserve"> A webhook is set (https://stale.example.com/hook); the bridge polls instead.</text>
<text x="26.0" y="385.0" fill="#58a6ff" xml:space="preserve">  Remove the webhook? [Y/n]: y</text>
<text x="26.0" y="402.5" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="402.5" fill="#3fb950" font-weight="bold" xml:space="preserve">✓</text>
<text x="51.3" y="402.5" fill="#c9d1d9" xml:space="preserve"> Webhook removed</text>
<text x="26.0" y="437.5" fill="#f0f6fc" font-weight="bold" xml:space="preserve">[3/6] Group privacy mode</text>
<text x="26.0" y="455.0" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="455.0" fill="#d29922" font-weight="bold" xml:space="preserve">!</text>
<text x="51.3" y="455.0" fill="#c9d1d9" xml:space="preserve"> Privacy mode is ON. In groups your bot will only see /commands,</text>
<text x="26.0" y="472.5" fill="#6e7681" xml:space="preserve">    not ordinary messages. It is fine if you only want direct messages.</text>
<text x="26.0" y="507.5" fill="#6e7681" xml:space="preserve">    To turn it off: message @BotFather → /setprivacy → pick</text>
<text x="26.0" y="525.0" fill="#6e7681" xml:space="preserve">    @your_bot → Disable. Then remove and re-add the bot to any group.</text>
<text x="26.0" y="560.0" fill="#58a6ff" xml:space="preserve">  Done that? (checks again) [y/N]: y</text>
<text x="26.0" y="577.5" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="577.5" fill="#3fb950" font-weight="bold" xml:space="preserve">✓</text>
<text x="51.3" y="577.5" fill="#c9d1d9" xml:space="preserve"> Privacy mode is now off</text>
<text x="26.0" y="612.5" fill="#f0f6fc" font-weight="bold" xml:space="preserve">[4/6] Who may use the bot</text>
<text x="26.0" y="630.0" fill="#c9d1d9" xml:space="preserve">  Sessions run tools without asking, so this allowlist is the</text>
<text x="26.0" y="647.5" fill="#c9d1d9" xml:space="preserve">  only thing between a stranger and a shell on this machine.</text>
<text x="26.0" y="700.0" fill="#c9d1d9" xml:space="preserve">  Open Telegram and send @your_bot any message now.</text>
<text x="26.0" y="717.5" fill="#c9d1d9" xml:space="preserve">  Waiting up to 3 minutes…</text>
<text x="26.0" y="735.0" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="735.0" fill="#3fb950" font-weight="bold" xml:space="preserve">✓</text>
<text x="51.3" y="735.0" fill="#c9d1d9" xml:space="preserve"> Got it: Alex (id 8148000111)</text>
<text x="26.0" y="752.5" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="26.0" y="770.0" fill="#58a6ff" xml:space="preserve">  Add a group chat as well? [y/N]: y</text>
<text x="26.0" y="805.0" fill="#c9d1d9" xml:space="preserve">  Add @your_bot to the group, then send a message in it.</text>
<text x="26.0" y="822.5" fill="#c9d1d9" xml:space="preserve">  Waiting up to 3 minutes…</text>
<text x="26.0" y="840.0" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="840.0" fill="#3fb950" font-weight="bold" xml:space="preserve">✓</text>
<text x="51.3" y="840.0" fill="#c9d1d9" xml:space="preserve"> &quot;Home&quot; (id -1001234567890)</text>
<text x="26.0" y="857.5" fill="#58a6ff" xml:space="preserve">    Add another group? [y/N]: n</text>
<text x="26.0" y="892.5" fill="#f0f6fc" font-weight="bold" xml:space="preserve">[5/6] Workspace and persona</text>
<text x="26.0" y="910.0" fill="#58a6ff" xml:space="preserve">  This directory is where every session runs. Its CLAUDE.md is</text>
<text x="26.0" y="927.5" fill="#c9d1d9" xml:space="preserve">  what gives the bot its identity, and its .claude/ supplies skills.</text>
<text x="26.0" y="962.5" fill="#58a6ff" xml:space="preserve">  Workspace directory [/Users/you/my-assistant]: /Users/you/my-assistant</text>
<text x="26.0" y="980.0" fill="#c9d1d9" xml:space="preserve">  Assistant name [Claude]: Ada</text>
<text x="26.0" y="997.5" fill="#58a6ff" xml:space="preserve">  Timezone [Europe/London]: </text>
<text x="26.0" y="1015.0" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="26.0" y="1032.5" fill="#58a6ff" xml:space="preserve">  No CLAUDE.md in /Users/you/my-assistant. Create a starter one? [Y/n]: y</text>
<text x="26.0" y="1050.0" fill="#c9d1d9" xml:space="preserve">  Your name (for the persona file): Alex</text>
<text x="26.0" y="1085.0" fill="#f0f6fc" font-weight="bold" xml:space="preserve">[6/6] Review</text>
<text x="26.0" y="1120.0" fill="#c9d1d9" xml:space="preserve">  TELEGRAM_BOT_TOKEN       812345…-one</text>
<text x="26.0" y="1137.5" fill="#c9d1d9" xml:space="preserve">  ALLOWED_TELEGRAM_USERS   8148000111</text>
<text x="26.0" y="1155.0" fill="#c9d1d9" xml:space="preserve">  ALLOWED_TELEGRAM_GROUPS  -1001234567890</text>
<text x="26.0" y="1172.5" fill="#c9d1d9" xml:space="preserve">  CLAUDE_CWD               /Users/you/my-assistant</text>
<text x="26.0" y="1190.0" fill="#c9d1d9" xml:space="preserve">  ASSISTANT_NAME           Ada</text>
<text x="26.0" y="1207.5" fill="#c9d1d9" xml:space="preserve">  BRIDGE_TIMEZONE          Europe/London</text>
<text x="26.0" y="1225.0" fill="#c9d1d9" xml:space="preserve">  CHAT_NAMES               {&quot;-1001234567890&quot;:&quot;Home&quot;}</text>
<text x="26.0" y="1260.0" fill="#c9d1d9" xml:space="preserve">  Writes .env (mode 600) and /Users/you/my-assistant/CLAUDE.md.</text>
<text x="26.0" y="1277.5" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="26.0" y="1295.0" fill="#58a6ff" xml:space="preserve">  Write these? [Y/n]: y</text>
<text x="26.0" y="1312.5" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="1312.5" fill="#3fb950" font-weight="bold" xml:space="preserve">✓</text>
<text x="51.3" y="1312.5" fill="#c9d1d9" xml:space="preserve"> Created /Users/you/my-assistant</text>
<text x="26.0" y="1330.0" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="1330.0" fill="#3fb950" font-weight="bold" xml:space="preserve">✓</text>
<text x="51.3" y="1330.0" fill="#c9d1d9" xml:space="preserve"> Wrote /Users/you/my-assistant/CLAUDE.md</text>
<text x="26.0" y="1347.5" fill="#c9d1d9" xml:space="preserve">  </text>
<text x="42.8" y="1347.5" fill="#3fb950" font-weight="bold" xml:space="preserve">✓</text>
<text x="51.3" y="1347.5" fill="#c9d1d9" xml:space="preserve"> Wrote /Users/you/bridge/.env</text>
<text x="26.0" y="1382.5" fill="#3fb950" font-weight="bold" xml:space="preserve">Ready.</text>
<text x="26.0" y="1417.5" fill="#c9d1d9" xml:space="preserve">  Start it:        npm start</text>
<text x="26.0" y="1435.0" fill="#c9d1d9" xml:space="preserve">  Then message @your_bot on Telegram.</text>
<text x="26.0" y="1470.0" fill="#58a6ff" xml:space="preserve">  Only one process may poll a bot token: stop this before</text>
<text x="26.0" y="1487.5" fill="#c9d1d9" xml:space="preserve">  installing the service, or the two will fight over it.</text>
<text x="26.0" y="1522.5" fill="#c9d1d9" xml:space="preserve">  Run at login:    ./setup.sh   (macOS launchd)</text>
<text x="26.0" y="1540.0" fill="#c9d1d9" xml:space="preserve">  Scheduled jobs:  cp cron-jobs.example.mjs cron-jobs.local.mjs</text>
<text x="26.0" y="1557.5" fill="#c9d1d9" xml:space="preserve">  Everything else: see .env.example and README.md</text>
</svg>