name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.12 is the floor: npm start uses --env-file-if-exists, which
        # landed there. Testing it explicitly keeps the engines field honest.
        node: ["20.12", "22", "24"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  wizard:
    runs-on: ubuntu-latest
    name: setup wizard end to end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The wizard checks for the claude binary. A stub keeps the run honest
      # about everything else without pretending Claude Code is installed.
      - name: stub the claude binary
        run: |
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\necho "0.0.0 (stub)"\n' > "$HOME/bin/claude"
          chmod +x "$HOME/bin/claude"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: npm run test:wizard

  syntax:
    runs-on: ubuntu-latest
    name: syntax and shell checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The test suite imports most modules, but not bridge.mjs (it would
      # start the bot) or setup-wizard.mjs (it needs a terminal). Parse every
      # file so a syntax error in either cannot reach main.
      # find, not a glob: an unmatched glob expands to the literal pattern
      # and fails the step for the wrong reason.
      - name: node --check every module
        run: find . -name '*.mjs' -not -path './node_modules/*' -print0 |
             xargs -0 -n1 node --check
      - name: bash -n every script
        run: find . -name '*.sh' -not -path './node_modules/*' -print0 |
             xargs -0 -n1 bash -n
